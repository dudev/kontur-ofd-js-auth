# https://megalinter.io/latest/config-file/
APPLY_FIXES: none
FILTER_REGEX_EXCLUDE: "(node_modules/|dist/|coverage/|megalinter-reports/)"
DISABLE:
  # Noisy on Russian-language commit messages/docs without a custom dictionary.
  - SPELL
  # Low value on a small, young repo — mostly flags intentionally similar test fixtures.
  - COPYPASTE
DISABLE_LINTERS:
  # Own ESLint job already covers this with project-specific config (typescript-eslint strict).
  - TYPESCRIPT_ES
  # Bundled grype v0.94.0 can't load its current vulnerability DB (schema migration error);
  # trivy and npm audit already cover dependency vulnerabilities.
  - REPOSITORY_GRYPE
PRINT_ALPACA: false
