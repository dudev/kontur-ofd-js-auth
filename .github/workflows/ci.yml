name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, build, package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # npm ci fails if package.json/package-lock.json are out of sync — the closest
      # equivalent here to `composer validate`.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # Catches broken exports/types/files before publishing.
      - run: npx --yes publint@0.3 --strict
      - run: npm pack --dry-run

  test:
    name: "Vitest (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.node == '22'
        run: npx vitest run --coverage
      - if: matrix.node != '22'
        run: npm test
      - if: matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
